[package]
name = "entitlement"
version = "0.1.0"
edition = "2021"
description = "Pure entitlement engine for the Starlink Wi-Fi platform: plans, meters, device slots and RADIUS limits"
license = "UNLICENSED"

[dependencies]
# Optional: turn on to serialise plans and entitlements (needed for the plan_snapshot JSON column).
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1"
