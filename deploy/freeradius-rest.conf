# /etc/freeradius/3.0/mods-available/rest  (enable: ln -s into mods-enabled)
# Validated with FreeRADIUS 3.2 (config check, accept/reject mapping, accounting). The X-Agent-Key header is added by the policy
# in deploy/freeradius-wifibms.policy: a `header =` line inside this module is silently ignored by FreeRADIUS.
rest {
    connect_uri = "http://127.0.0.1:8081"
    connect_timeout = 3.0
    # Do not open connections at start-up: otherwise FreeRADIUS refuses to start when the site agent is not up yet (after a reboot).
    pool {
        start = 0
        min = 0
        spare = 1
        max = 10
    }
    authorize {
        uri = "${..connect_uri}/radius/authorize"
        method = 'post'
        body = 'json'
        data = '{ "User-Name": "%{User-Name}", "User-Password": "%{User-Password}", "Calling-Station-Id": "%{Calling-Station-Id}" }'
    }
    accounting {
        uri = "${..connect_uri}/radius/accounting"
        method = 'post'
        body = 'json'
        data = '{ "Acct-Status-Type": "%{Acct-Status-Type}", "Acct-Session-Id": "%{Acct-Session-Id}", "User-Name": "%{User-Name}", "Calling-Station-Id": "%{Calling-Station-Id}", "Framed-IP-Address": "%{Framed-IP-Address}", "Acct-Input-Octets": "%{Acct-Input-Octets}", "Acct-Output-Octets": "%{Acct-Output-Octets}", "Acct-Input-Gigawords": "%{Acct-Input-Gigawords}", "Acct-Output-Gigawords": "%{Acct-Output-Gigawords}", "Acct-Session-Time": "%{Acct-Session-Time}", "Acct-Terminate-Cause": "%{Acct-Terminate-Cause}" }'
    }
}
# In sites-enabled/default: authorize { wifibms_rest  update control { Auth-Type := Accept } }
#                           accounting { wifibms_rest }   (see docs/installation.md)
