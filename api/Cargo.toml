[package]
name = "platform-api"
version = "0.1.0"
edition = "2021"
description = "Central API for the Starlink Wi-Fi platform: portal orders, Paystack payments, entitlement fulfilment"
license = "UNLICENSED"

[lib]
name = "platform_api"
path = "src/lib.rs"

[[bin]]
name = "platform-api"
path = "src/main.rs"

[dependencies]
entitlement = { path = "../entitlement", features = ["serde"] }

axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.6", features = ["set-header", "trace", "request-id", "cors", "timeout"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "macros", "ipnetwork"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
hmac = "0.12"
sha1 = "0.10"
argon2 = "0.5"
subtle = "2"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
