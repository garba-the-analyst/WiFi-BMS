<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portal: checkout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#0E1726}
a{color:#0F766E}a:hover{color:#0B5A54}
button,input{font-family:inherit}
</style>
</helmet>
<div style="position:relative;width:390px;height:900px;box-sizing:border-box;background:#F3F5F8;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#0E1726">

  <div style="display:flex;align-items:center;gap:12px;padding:20px 20px 0">
    <a href="Main.dc.html" aria-label="Back to plans" style="width:40px;height:40px;border-radius:10px;background:#FFFFFF;border:1px solid #DCE2EA;display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin:0;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px">Checkout</h1>
  </div>

  <div style="margin:18px 20px 0;background:#FFFFFF;border:1px solid #DCE2EA;border-radius:14px;padding:16px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <div style="font-weight:600;font-size:16px">Daily plan</div>
        <div style="margin-top:3px;font-size:13px;color:#55627A">24 hours of active use, 1 device, 5 Mbps</div>
      </div>
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:18px">₦[price]</div>
    </div>
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid #DCE2EA;display:flex;justify-content:space-between;font-size:14px">
      <span style="color:#55627A">Total</span><span style="font-weight:600">₦[price]</span>
    </div>
  </div>

  <div style="margin:16px 20px 0">
    <label for="phone" style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Phone number</label>
    <input id="phone" type="tel" placeholder="0801 234 5678" style="width:100%;height:48px;box-sizing:border-box;border:1px solid #C5CEDA;border-radius:10px;padding:0 14px;font-size:16px;color:#0E1726;background:#FFFFFF">
    <div style="margin-top:6px;font-size:12.5px;color:#55627A">We send your access code and receipt here.</div>
  </div>

  <label style="margin:14px 20px 0;display:flex;align-items:flex-start;gap:10px;background:#FFFFFF;border:1px solid #DCE2EA;border-radius:12px;padding:12px 14px">
    <input type="checkbox" style="width:20px;height:20px;accent-color:#0F766E;margin:1px 0 0;flex:none">
    <span style="font-size:13.5px;line-height:1.4"><b style="font-weight:600">Create an account</b><br><span style="color:#55627A">Keep your plans, devices and wallet, and sign in faster next time.</span></span>
  </label>

  <div style="margin:16px 20px 0">
    <div style="font-size:13px;font-weight:600;margin-bottom:8px">Pay with</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <label style="display:flex;align-items:center;gap:12px;background:#E3F3F1;border:2px solid #0F766E;border-radius:12px;padding:12px 14px">
        <input type="radio" name="method" checked style="width:20px;height:20px;accent-color:#0F766E;margin:0">
        <span style="flex:1;font-size:14.5px;font-weight:600">Bank transfer<br><span style="font-weight:400;font-size:12.5px;color:#3E4B63">Quick, no card needed</span></span>
      </label>
      <label style="display:flex;align-items:center;gap:12px;background:#FFFFFF;border:1px solid #DCE2EA;border-radius:12px;padding:13px 15px">
        <input type="radio" name="method" style="width:20px;height:20px;accent-color:#0F766E;margin:0">
        <span style="flex:1;font-size:14.5px;font-weight:600">USSD<br><span style="font-weight:400;font-size:12.5px;color:#55627A">Dial a code from any phone</span></span>
      </label>
      <label style="display:flex;align-items:center;gap:12px;background:#FFFFFF;border:1px solid #DCE2EA;border-radius:12px;padding:13px 15px">
        <input type="radio" name="method" style="width:20px;height:20px;accent-color:#0F766E;margin:0">
        <span style="flex:1;font-size:14.5px;font-weight:600">Card<br><span style="font-weight:400;font-size:12.5px;color:#55627A">Your bank may ask you to confirm</span></span>
      </label>
    </div>
  </div>

  <label style="margin:16px 20px 0;display:flex;align-items:flex-start;gap:10px">
    <input type="checkbox" checked style="width:20px;height:20px;accent-color:#0F766E;margin:1px 0 0;flex:none">
    <span style="font-size:12.5px;line-height:1.45;color:#55627A">I accept the <a href="#" style="color:#0F766E;font-weight:600">terms of use</a> and the <a href="#" style="color:#0F766E;font-weight:600">privacy notice</a>. For security, we record your device and connection details.</span>
  </label>

  <div style="position:absolute;left:0;right:0;bottom:0;background:#FFFFFF;border-top:1px solid #DCE2EA;padding:14px 20px 22px">
    <a href="Portal-Connected.dc.html" style="display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;background:#0F766E;color:#FFFFFF;font-weight:600;font-size:16px;text-decoration:none">Pay ₦[price]</a>
    <div style="margin-top:10px;text-align:center;font-size:12px;color:#55627A">Payment opens on Paystack. Come back to this page when you are done.</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
