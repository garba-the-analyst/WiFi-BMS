<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portal: choose a plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#0E1726}
a{color:#0F766E}a:hover{color:#0B5A54}
button,input{font-family:inherit}
</style>
</helmet>
<div style="position:relative;width:390px;height:900px;box-sizing:border-box;background:#F3F5F8;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#0E1726">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 20px 0">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:36px;height:36px;border-radius:10px;background:#0F766E;display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="#FFFFFF"/></svg>
      </div>
      <span style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:18px">[Your Wi-Fi name]</span>
    </div>
    <span style="font-size:12px;font-weight:500;color:#55627A;background:#FFFFFF;border:1px solid #DCE2EA;border-radius:999px;padding:5px 10px">Site 1</span>
  </div>

  <div style="padding:22px 20px 0">
    <h1 style="margin:0;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px;line-height:1.1">Get online</h1>
    <p style="margin:8px 0 0;font-size:14px;line-height:1.45;color:#55627A">Pick a plan, then pay by bank transfer, USSD or card.</p>
  </div>

  <div style="margin:18px 20px 0;display:flex;background:#FFFFFF;border:1px solid #DCE2EA;border-radius:12px;padding:4px;gap:4px">
    <button style="flex:1;height:40px;border:0;border-radius:9px;background:#0F766E;color:#FFFFFF;font-weight:600;font-size:14px">Time</button>
    <button style="flex:1;height:40px;border:0;border-radius:9px;background:transparent;color:#55627A;font-weight:500;font-size:14px">Data</button>
    <button style="flex:1;height:40px;border:0;border-radius:9px;background:transparent;color:#55627A;font-weight:500;font-size:14px">Time + data</button>
  </div>
  <p style="margin:10px 20px 0;font-size:12.5px;line-height:1.45;color:#55627A">Time plans only count the minutes you are online and using data.</p>

  <div style="margin:14px 20px 0;display:flex;flex-direction:column;gap:10px">

    <label style="display:flex;align-items:center;gap:12px;background:#FFFFFF;border:1px solid #DCE2EA;border-radius:14px;padding:14px 16px">
      <input type="radio" name="plan" style="width:20px;height:20px;accent-color:#0F766E;margin:0">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:16px">Hourly</div>
        <div style="margin-top:3px;font-size:13px;color:#55627A">60 active minutes, use within 24 hours</div>
        <div style="margin-top:8px;display:flex;gap:6px"><span style="font-size:11.5px;font-weight:500;color:#55627A;background:#F3F5F8;border-radius:6px;padding:3px 7px">1 device</span><span style="font-size:11.5px;font-weight:500;color:#55627A;background:#F3F5F8;border-radius:6px;padding:3px 7px">5 Mbps</span></div>
      </div>
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:18px">₦[price]</div>
    </label>

    <label style="display:flex;align-items:center;gap:12px;background:#E3F3F1;border:2px solid #0F766E;border-radius:14px;padding:13px 15px">
      <input type="radio" name="plan" checked style="width:20px;height:20px;accent-color:#0F766E;margin:0">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:16px">Daily</div>
        <div style="margin-top:3px;font-size:13px;color:#3E4B63">24 hours of active use from your first connection</div>
        <div style="margin-top:8px;display:flex;gap:6px"><span style="font-size:11.5px;font-weight:500;color:#0B5A54;background:#FFFFFF;border-radius:6px;padding:3px 7px">1 device</span><span style="font-size:11.5px;font-weight:500;color:#0B5A54;background:#FFFFFF;border-radius:6px;padding:3px 7px">5 Mbps</span></div>
      </div>
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:18px">₦[price]</div>
    </label>

    <label style="display:flex;align-items:center;gap:12px;background:#FFFFFF;border:1px solid #DCE2EA;border-radius:14px;padding:14px 16px">
      <input type="radio" name="plan" style="width:20px;height:20px;accent-color:#0F766E;margin:0">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:16px">Weekly</div>
        <div style="margin-top:3px;font-size:13px;color:#55627A">7 days, share between your devices</div>
        <div style="margin-top:8px;display:flex;gap:6px"><span style="font-size:11.5px;font-weight:500;color:#55627A;background:#F3F5F8;border-radius:6px;padding:3px 7px">3 devices</span><span style="font-size:11.5px;font-weight:500;color:#55627A;background:#F3F5F8;border-radius:6px;padding:3px 7px">5 Mbps</span></div>
      </div>
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:18px">₦[price]</div>
    </label>

    <label style="display:flex;align-items:center;gap:12px;background:#FFFFFF;border:1px solid #DCE2EA;border-radius:14px;padding:14px 16px">
      <input type="radio" name="plan" style="width:20px;height:20px;accent-color:#0F766E;margin:0">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:16px">Monthly</div>
        <div style="margin-top:3px;font-size:13px;color:#55627A">30 days, best for regular users</div>
        <div style="margin-top:8px;display:flex;gap:6px"><span style="font-size:11.5px;font-weight:500;color:#55627A;background:#F3F5F8;border-radius:6px;padding:3px 7px">3 devices</span><span style="font-size:11.5px;font-weight:500;color:#55627A;background:#F3F5F8;border-radius:6px;padding:3px 7px">10 Mbps</span></div>
      </div>
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:18px">₦[price]</div>
    </label>
  </div>

  <div style="margin:16px 20px 0;background:#FFFFFF;border:1px solid #DCE2EA;border-radius:14px;padding:14px 16px">
    <label for="code" style="display:block;font-size:13px;font-weight:600">Already paid? Enter your access code</label>
    <div style="margin-top:8px;display:flex;gap:8px">
      <input id="code" type="text" placeholder="8-character code" style="flex:1;min-width:0;height:44px;box-sizing:border-box;border:1px solid #C5CEDA;border-radius:10px;padding:0 12px;font-size:15px;color:#0E1726;background:#FFFFFF">
      <button style="height:44px;padding:0 16px;border:1px solid #0F766E;border-radius:10px;background:#FFFFFF;color:#0F766E;font-weight:600;font-size:14px">Connect</button>
    </div>
    <div style="margin-top:10px;font-size:13px;color:#55627A">Member? <a href="Portal-Member.dc.html" style="font-weight:600">Sign in</a> to use your saved plans and wallet.</div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;background:#FFFFFF;border-top:1px solid #DCE2EA;padding:14px 20px 26px">
    <a href="Portal-Checkout.dc.html" style="display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;background:#0F766E;color:#FFFFFF;font-weight:600;font-size:16px;text-decoration:none">Continue with Daily</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
